name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const json = path => JSON.parse(readFileSync(path, 'utf8'));
          const version = json('package.json').version;
          const cargoPackage = readFileSync('src-tauri/Cargo.toml', 'utf8')
            .split('[package]')[1].split('\n[')[0];
          const cargoVersion = cargoPackage.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          assert.equal(json('src-tauri/tauri.conf.json').version, version);
          assert.equal(cargoVersion, version);
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`,
            'Tag must match the app version in package.json, tauri.conf.json and Cargo.toml');
          NODE

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      # Real-XRK integration tests require private, untracked data/ fixtures.
      # These suites use synthetic data and generated native video fixtures.
      - name: Test Rust and native video
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --test video --test video_analysis

      - name: Build and publish Apple Silicon installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Apex Telemetry v__VERSION__ Beta
          releaseBody: |
            Download the .dmg for Apple Silicon Macs running macOS 13 or later.
            Drag Apex Telemetry into Applications. This ad-hoc signed app is not notarized;
            macOS may require approval in System Settings > Privacy & Security > Open Anyway.
            See the README for installation details and Gatekeeper limitations.
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: true
          args: --target aarch64-apple-darwin --bundles app,dmg -- --locked
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
