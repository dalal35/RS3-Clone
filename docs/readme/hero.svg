<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Ten Tenths Telemetry</title><desc id="desc">Local-first motorsport telemetry. Every lap tells a story. A decorative red comparison trace draws once, then remains still. It is an illustration, not measured telemetry.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,Menlo,monospace}.trace{animation:draw 2.8s cubic-bezier(.22,.61,.36,1) both}.intro{animation:enter .8s ease-out both}@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}@keyframes enter{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.trace,.intro{animation:none}}</style>

<defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#161b22"/><stop offset="1" stop-color="#090c10"/></linearGradient><linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f04452" stop-opacity=".14"/><stop offset="1" stop-color="#f04452" stop-opacity="0"/></linearGradient><clipPath id="edge"><rect width="1200" height="520" rx="18"/></clipPath></defs>
<g clip-path="url(#edge)"><rect width="1200" height="520" fill="url(#surface)"/><path d="M840 0H1200V315H765Z" fill="#ffffff" opacity=".018"/>
<path d="M48 0V520M1152 0V520" stroke="#ffffff" stroke-opacity=".045"/>
<rect x="48" y="46" width="26" height="4" fill="#f04452"/><text x="88" y="53" fill="#b6bec9" font-size="13" letter-spacing="3" class="mono">LOCAL-FIRST / MOTORSPORT ANALYSIS</text>
<g transform="translate(998 45) scale(1.17)" fill="#f04452"><path d="M10 12H45L41.64 26H30.64L21.52 64H8.52L17.64 26H6.64Z M48 12H83L79.64 26H68.64L57.6 72H44.6L55.64 26H44.64Z M86 12H121L117.64 26H106.64L97.52 64H84.52L93.64 26H82.64Z"/></g>
<g class="intro"><text x="46" y="139" fill="#ffffff" font-size="66" font-weight="700" letter-spacing="-2.5">TEN TENTHS</text><text x="48" y="190" fill="#ffffff" font-size="40" letter-spacing="9">TELEMETRY</text>
<text x="48" y="239" fill="#b6bec9" font-size="21">Every lap tells a story. Find your next tenth.</text></g>
<g stroke="#ffffff" stroke-opacity=".07"><path d="M48 300H1152M48 350H1152M48 400H1152M48 450H1152M232 284V450M416 284V450M600 284V450M784 284V450M968 284V450"/></g>
<text x="48" y="283" fill="#84909f" font-size="11" letter-spacing="2" class="mono">ILLUSTRATIVE COMPARISON</text>
<path d="M48 345L125 329L179 320L211 389Q227 426 254 385L294 337L366 308L420 302L453 379Q470 420 495 376L540 322L612 311L669 298L704 381Q720 422 748 376L796 321L870 307L920 300L954 377Q970 421 999 369L1043 319L1100 307L1152 316" fill="none" stroke="#79838f" stroke-width="2"/>
<path d="M48 357L125 340L179 331L211 401Q227 438 254 397L294 348L366 321L420 315L453 391Q470 432 495 388L540 335L612 324L669 311L704 393Q720 434 748 388L796 334L870 320L920 313L954 389Q970 433 999 381L1043 332L1100 320L1152 329V450H48Z" fill="url(#wash)"/>
<path class="trace" pathLength="1" d="M48 357L125 340L179 331L211 401Q227 438 254 397L294 348L366 321L420 315L453 391Q470 432 495 388L540 335L612 324L669 311L704 393Q720 434 748 388L796 334L870 320L920 313L954 389Q970 433 999 381L1043 332L1100 320L1152 329" fill="none" stroke="#f04452" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M48 474H1152" stroke="#2a313a"/><text x="48" y="501" fill="#c6cdd6" font-size="12" letter-spacing="2" class="mono">IMPORT. COMPARE. UNDERSTAND.</text><text x="1152" y="501" text-anchor="end" fill="#84909f" font-size="12" letter-spacing="1" class="mono">XRK / GPS / VIDEO</text></g>
</svg>
